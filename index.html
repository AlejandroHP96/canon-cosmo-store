<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/src/assets/logo-favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fondo del navegador antes de que cargue el CSS, y color de su barra
         superior en móvil. El mismo --color-background de index.css. -->
    <meta name="theme-color" content="#060946" />
    <style>
      html {
        background-color: #060946;
      }
    </style>

    <!--
      Etiquetas por defecto para los rastreadores de WhatsApp, Discord, Twitter
      y Telegram, que NO ejecutan JavaScript y por tanto nunca ven las que
      inyecta react-helmet-async al arrancar React.

      data-rh="true" hace que Helmet las reemplace al hidratar en lugar de
      añadir duplicados, así el navegador y Google acaban viendo las de la
      ruta concreta.

      __SITE_URL__ lo sustituye vite.config.ts en el build.
    -->
    <title data-rh="true">Cañón Cosmo Store</title>
    <meta
      data-rh="true"
      name="description"
      content="Tienda especializada en Trading Card Games, Funko Pop, figuras y coleccionables. Pokémon, One Piece, Final Fantasy, Digimon y mucho más."
    />
    <link data-rh="true" rel="canonical" href="__SITE_URL__/" />

    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="Cañón Cosmo Store" />
    <meta data-rh="true" property="og:title" content="Cañón Cosmo Store" />
    <meta
      data-rh="true"
      property="og:description"
      content="Tienda especializada en Trading Card Games, Funko Pop, figuras y coleccionables. Pokémon, One Piece, Final Fantasy, Digimon y mucho más."
    />
    <meta data-rh="true" property="og:url" content="__SITE_URL__/" />
    <meta data-rh="true" property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />
    <meta data-rh="true" property="og:image:alt" content="Cañón Cosmo Store" />
    <meta data-rh="true" property="og:locale" content="es_ES" />

    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="Cañón Cosmo Store" />
    <meta
      data-rh="true"
      name="twitter:description"
      content="Tienda especializada en Trading Card Games, Funko Pop, figuras y coleccionables. Pokémon, One Piece, Final Fantasy, Digimon y mucho más."
    />
    <meta data-rh="true" name="twitter:image" content="__SITE_URL__/og-image.jpg" />

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
