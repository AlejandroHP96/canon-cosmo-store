name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ci y no install: respeta el lockfile exactamente y falla si se ha
      # quedado desincronizado con package.json
      - run: npm ci

      - run: npm run lint

      - run: npm test

      # tsc -b va dentro de build, así que esto cubre también los tipos
      - run: npm run build
